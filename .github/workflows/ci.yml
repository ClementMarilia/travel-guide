name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_guide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `prisma generate` (run by postinstall) needs a URL; the integration tests use the same database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_guide_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_guide_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - run: npm run typecheck

      - run: npm test
